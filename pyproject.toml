[build-system]
requires = ["scikit-build-core>=0.10", "numpy>=1.23"]
build-backend = "scikit_build_core.build"

[project]
name = "zvode"
version = "0.1.0"
description = "Python bindings to the classic ZVODE ODE solver"
authors = [{name = "Ivan Pribec", email = "ivan.pribec@gmail.com"}]
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["ODE", "solver", "ZVODE", "ODEPACK", "complex", "scientific computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Fortran",
    "Programming Language :: C",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
test = ["pytest>=9"]
examples = ["matplotlib"]

[project.urls]
Repository = "https://github.com/ivan-pi/zvode"
Issues = "https://github.com/ivan-pi/zvode/issues"

[tool.pytest]
minversion = "9.0"
testpaths = ["test"]
addopts = ["-ra", "--strict-markers"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build.targets = ["_zvode"]
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/zvode"]
sdist.include = [
    "CMakeLists.txt",
    "extern/**",
    "src/_zvode.c",
    "src/zvode.h",
]
sdist.exclude = [
    ".github/**",
    ".gitignore",
    "docs/**",
    "TODO.txt",
    "notes.txt",
    "test/*.f",
    "test/*.F90",
]
