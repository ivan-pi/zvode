[build-system]
requires = ["scikit-build-core>=0.10", "numpy>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "zvode"
version = "0.1.0"
description = "Python bindings to the classic ZVODE ODE solver"
authors = [{name = "Ivan Pribec", email = "ivan.pribec@gmail.com"}]
requires-python = ">=3.9"
readme = "README.md"
keywords = ["ODE", "solver", "ZVODE", "ODEPACK", "complex", "scientific computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: BSD Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Fortran",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/ivan-pi/zvode"
Repository = "https://github.com/ivan-pi/zvode"
Issues = "https://github.com/ivan-pi/zvode/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build.targets = ["_zvode"]
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/zvode"]
sdist.include = [
    "CMakeLists.txt",
    "extern/**",
    "src/_zvode.c",
    "src/zvode.h",
]
sdist.exclude = [
    ".github/**",
    ".gitignore",
    "docs/**",
    "orig/**",
    "TODO.txt",
    "notes.txt",
]

# ---------------------------------------------------------------------------
# cibuildwheel
# ---------------------------------------------------------------------------

[tool.cibuildwheel]
# CPython 3.9–3.12; skip PyPy and 32-bit builds.
build = "cp39-* cp310-* cp311-* cp312-*"
skip  = "*-win32 *-manylinux_i686 *-musllinux*"

# Run the test suite inside every wheel environment.
test-requires = ["pytest"]
test-command  = "python -m pytest {project}/test -x -q"

[tool.cibuildwheel.linux]
# manylinux2014 images ship gfortran; just need BLAS headers.
before-all = "yum install -y openblas-devel"

[tool.cibuildwheel.macos]
# FC is set by fortran-lang/setup-fortran in the workflow; only BLAS needed.
before-all = """
    brew install openblas
    echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas)" >> "$CIBW_ENVIRONMENT_FILE"
"""