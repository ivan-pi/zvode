name: Build and publish wheels

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        # ubuntu-latest → Linux x86-64 (manylinux)
        # macos-14      → macOS arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fortran (macOS)
        if: runner.os == 'macOS'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 14

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "python -m pytest {project}/test -x -q"
          CIBW_CONFIG_SETTINGS_LINUX: "cmake.define.BLA_VENDOR=OpenBLAS"
          CIBW_CONFIG_SETTINGS_MACOS: "cmake.define.BLA_VENDOR=Apple"
          CIBW_BEFORE_ALL_LINUX: "yum install -y openblas-devel || dnf install -y openblas-devel"
          CIBW_ARCHS_MACOS: arm64
          # GCC 14 from Homebrew targets macOS 14; match the deployment target
          # so delocate accepts the bundled libgfortran and libquadmath.
          CIBW_ENVIRONMENT_MACOS: >-
            FC=gfortran-14
            MACOSX_DEPLOYMENT_TARGET=14.0

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/zvode
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
