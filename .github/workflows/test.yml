name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill at 10x, so they run only on a manual dispatch
        # (Actions -> Run workflow).  Every push and PR stays Linux-only.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python-version: ["3.10", "3.12"]
        include:
          # Exercise the numba compiled-callback tests in a release build, on
          # one cell only.  This merges into the existing ubuntu-latest / 3.12
          # job (no extra job) and pulls in numba via the `numba` extra; the
          # Tests (Debug) workflow covers the same path in a debug build.
          - os: ubuntu-latest
            python-version: "3.12"
            extras: "test,numba"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Fortran compiler and BLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gfortran libopenblas-dev

      - name: Set up gfortran 14 (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v gfortran-14 >/dev/null || brew install gcc@14
          echo "FC=$(command -v gfortran-14)" >> "$GITHUB_ENV"

      - name: Install package and test dependencies from source
        run: pip install -v ".[${{ matrix.extras || 'test' }}]"

      - name: Run tests
        run: python -m pytest test/ -v

      - name: Run doctests
        run: python -m pytest --doctest-modules --pyargs zvode
