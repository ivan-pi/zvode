name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Fortran compiler and BLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gfortran libopenblas-dev

      - name: Install Fortran compiler and BLAS (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc openblas
          # Homebrew installs gfortran as a versioned binary (e.g. gfortran-14).
          # Export FC so CMake finds it without a hardcoded name.
          FC="$(ls "$(brew --prefix gcc)/bin/gfortran-"* | sort | tail -1)"
          echo "FC=$FC" >> "$GITHUB_ENV"
          # Help CMake's find_package(BLAS) locate Homebrew's OpenBLAS.
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas)" >> "$GITHUB_ENV"

      - name: Install package from source
        run: pip install -v ".[test]"

      - name: Run tests
        run: pytest test/ -v
