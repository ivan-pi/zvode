name: Tests (NumPy 2)

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    name: NumPy 2 / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Fortran compiler and BLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gfortran libopenblas-dev

      - name: Install Fortran compiler and BLAS (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc openblas
          FC="$(ls "$(brew --prefix gcc)/bin/gfortran-"* | sort | tail -1)"
          echo "FC=$FC" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas)" >> "$GITHUB_ENV"

      - name: Install package and test dependencies from source
        run: pip install -v ".[test]" "numpy>=2.0,<3"

      - name: Run tests
        run: python -m pytest test/ -v
