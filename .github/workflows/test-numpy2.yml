name: Tests (NumPy 2)

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    name: NumPy 2 / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies from source
        run: pip install -v ".[test]" "numpy>=2.0,<3"

      - name: Run tests
        run: python -m pytest test/ -v
