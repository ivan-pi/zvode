name: Tests (NumPy 2)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Select OS matrix
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      # macOS runners bill at 10x, so they are opt-in: they run only on a
      # manual dispatch or when a pull request carries the `ci:macos` label.
      # Every push and every other PR stays Linux-only.
      - id: pick
        env:
          RUN_MACOS: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
        run: |
          if [ "$RUN_MACOS" = "true" ]; then
            echo 'os=["ubuntu-latest", "macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: matrix
    name: NumPy 2 / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install BLAS & LAPACK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libopenblas-dev

      - name: Select Fortran compiler (macOS)
        if: runner.os == 'macOS'
        run: echo "FC=gfortran-14" >> "$GITHUB_ENV"

      - name: Install package and test dependencies from source
        run: pip install -v ".[test]" "numpy>=2.0,<3"

      - name: Run tests
        run: python -m pytest test/ -v

      - name: Run doctests
        run: python -m pytest --doctest-modules --pyargs zvode
