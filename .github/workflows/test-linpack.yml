name: Test LINPACK backend

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-linpack:
    name: LINPACK / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OpenBLAS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libopenblas-dev

      - name: Install package and test dependencies from source
        run: |
          pip install -v ".[test]" \
            --config-settings="cmake.args=-DZVODE_LINALG_BACKEND=LINPACK"

      - name: Run tests
        run: python -m pytest test/ -v

      - name: Run doctests
        run: python -m pytest --doctest-modules --pyargs zvode
