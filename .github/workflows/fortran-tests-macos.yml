name: Fortran tests (macOS)

# Multi-compiler conformance: build and run the native (non-Python) ZVODE
# test programs through CTest on macOS with the LLVM toolchain (flang for
# Fortran, clang for C), using Accelerate for BLAS/LAPACK.  This complements
# the gfortran/Linux coverage in fortran-tests.yml.
#
# macOS runners bill at 10x, so this workflow runs only on a manual dispatch
# (Actions -> Run workflow) or a version-tag push (v*); it does not run on
# branch pushes or pull_requests.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ctest-macos-flang:
    name: CTest / macos-latest / flang+clang / ${{ matrix.backend }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [LAPACK, LINPACK]

    steps:
      - uses: actions/checkout@v4

      - name: Install flang, CMake and Ninja
        run: brew install flang cmake ninja

      - name: Locate the flang binary
        run: |
          FC=$(command -v flang-new || command -v flang)
          echo "Using Fortran compiler: $FC"
          echo "FC=$FC" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build-fortran -G Ninja
          -DZVODE_BUILD_TESTS=ON
          -DZVODE_LINALG_BACKEND=${{ matrix.backend }}
          -DCMAKE_Fortran_COMPILER=${{ env.FC }}
          -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build-fortran

      - name: Test
        run: ctest --test-dir build-fortran --output-on-failure
