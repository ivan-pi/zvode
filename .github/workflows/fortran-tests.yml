name: Fortran tests

# Build and run the native (non-Python) ZVODE test programs through CTest.
# The Fortran drivers exercise the core via its functor-based public API
# (zvode_mod) and the C driver exercises the C API (src/zvode.h, i.e. the
# bind(c) layer in extern/c_zvode.f90), so the compiled core, linalg backend
# and C binding are all covered without the Python layer.  This is the
# native-test coverage that the multi-compiler conformance work builds on.

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  ctest:
    name: CTest / ubuntu-latest / gfortran / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [LAPACK, LINPACK]

    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran, OpenBLAS and CMake
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gfortran libopenblas-dev cmake ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-fortran -G Ninja
          -DZVODE_BUILD_TESTS=ON
          -DZVODE_LINALG_BACKEND=${{ matrix.backend }}

      - name: Build
        run: cmake --build build-fortran

      - name: Test
        run: ctest --test-dir build-fortran --output-on-failure

  # Multi-compiler conformance: build the same native test programs on macOS
  # with the LLVM toolchain (flang for Fortran, clang for C) instead of the
  # GNU toolchain above.  This shakes out gfortran-isms in the vendored Fortran
  # and the C binding layer ahead of the 1.0.0 multi-compiler conformance goal.
  # LAPACK/BLAS are provided by the system Accelerate framework, so no OpenBLAS
  # install is needed for either backend.
  ctest-macos-flang:
    name: CTest / macos-latest / flang+clang / ${{ matrix.backend }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [LAPACK, LINPACK]

    steps:
      - uses: actions/checkout@v4

      - name: Install flang, CMake and Ninja
        run: brew install flang cmake ninja

      - name: Locate the flang binary
        # Homebrew's flang has been published as both `flang-new` (older LLVM)
        # and `flang` (LLVM 20+); pick whichever exists.  CMake needs >= 3.25 to
        # recognise the LLVMFlang compiler id, which the runner's Homebrew CMake
        # satisfies.
        run: |
          FC=$(command -v flang-new || command -v flang)
          echo "Using Fortran compiler: $FC"
          echo "FC=$FC" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build-fortran -G Ninja
          -DZVODE_BUILD_TESTS=ON
          -DZVODE_LINALG_BACKEND=${{ matrix.backend }}
          -DCMAKE_Fortran_COMPILER=${{ env.FC }}
          -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build-fortran

      - name: Test
        run: ctest --test-dir build-fortran --output-on-failure
