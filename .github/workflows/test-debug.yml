name: Tests (Debug)

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-debug:
    name: Debug / ubuntu-latest / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Fortran compiler and BLAS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gfortran libopenblas-dev

      - name: Install package and test dependencies from source (Debug)
        # This is the one job that pulls in numba (via the `numba` extra), so
        # test/test_numba_callbacks.py actually runs here instead of self-skipping.
        # Every other job installs `.[test]` only and skips the numba path.
        run: |
          pip install -v ".[test,numba]" \
            --config-settings="cmake.build-type=Debug"

      - name: Run tests
        run: python -m pytest test/ -v

      - name: Run doctests
        run: python -m pytest --doctest-modules --pyargs zvode
